<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Medication Tracker 💊</title>

    <link
        rel="stylesheet"
        href="medication.css"
    >

</head>

<body>

<div class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        ← Back to Health
    </button>


    <header>

        <div class="icon">
            💊
        </div>

        <div>

            <p>DAILY HEALTH</p>

            <h1>
                Medication
            </h1>

            <span id="petName">
                🐾 My Pet
            </span>

        </div>

    </header>


    <!-- ADD MEDICATION -->

    <section class="card">

        <h2>
            💊 Add Medication
        </h2>


        <label>
            Medicine name
        </label>

        <input
            id="medicineName"
            type="text"
            placeholder="Medicine name"
        >


        <label>
            Dose
        </label>

        <input
            id="medicineDose"
            type="text"
            placeholder="Example: 1 tablet"
        >


        <label>
            Frequency
        </label>

        <select id="medicineFrequency">

            <option value="">
                Select frequency
            </option>

            <option value="Once daily">
                Once daily
            </option>

            <option value="Twice daily">
                Twice daily
            </option>

            <option value="Three times daily">
                Three times daily
            </option>

            <option value="As needed">
                As needed
            </option>

        </select>


        <label>
            Start date
        </label>

        <input
            id="startDate"
            type="date"
        >


        <label>
            End date
        </label>

        <input
            id="endDate"
            type="date"
        >


        <label>
            Reminder time
        </label>

        <input
            id="medicineTime"
            type="time"
        >


        <button
            class="purple-button"
            onclick="addMedication()"
        >
            ＋ Add Medication
        </button>

    </section>


    <!-- ALARM -->

    <section
        id="alarmBox"
        class="alarm-box hidden"
    >

        <div class="alarm-icon">
            🔔
        </div>

        <h2>
            💊 Medication Time!
        </h2>

        <p id="alarmMedicine">
            It is time for medication.
        </p>

        <button
            class="stop-button"
            onclick="stopAlarm()"
        >
            🛑 STOP RINGING
        </button>

    </section>


    <!-- ACTIVE MEDICATION -->

    <section class="card">

        <div class="section-title">

            <h2>
                💊 Active Medications
            </h2>

            <span id="medicineCount">
                0
            </span>

        </div>


        <div id="medicationList"></div>

    </section>


    <!-- HISTORY -->

    <section class="card">

        <h2>
            📋 Medication History
        </h2>

        <div id="medicationHistory"></div>

    </section>

</div>


<div id="toast"></div>


<script src="medication.js"></script>

</body>
</html>
