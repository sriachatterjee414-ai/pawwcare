<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bathroom Tracker 🐾</title>

    <link
        rel="stylesheet"
        href="bathroom.css"
    >

</head>

<body>

<div class="page">

    <button
        class="back-button"
        onclick="goBack()"
    >
        ← Back to Health
    </button>


    <header>

        <div class="icon">
            🚽
        </div>

        <div>

            <p>DAILY HEALTH</p>

            <h1>
                Bathroom Tracker
            </h1>

            <span id="petName">
                🐾 My Pet
            </span>

        </div>

    </header>


    <!-- ADD RECORD -->

    <section class="card">

        <h2>
            🚽 Add Bathroom Record
        </h2>


        <label>
            What happened?
        </label>


        <div class="type-grid">

            <button
                class="type-button"
                onclick="selectType('Poop', this)"
            >
                💩
                <span>Poop</span>
            </button>


            <button
                class="type-button"
                onclick="selectType('Urine', this)"
            >
                💧
                <span>Urine</span>
            </button>


            <button
                class="type-button"
                onclick="selectType('Vomit', this)"
            >
                🤢
                <span>Vomit</span>
            </button>

        </div>


        <label>
            Status
        </label>


        <div class="status-grid">

            <button
                class="status-button normal"
                onclick="selectStatus('Normal', this)"
            >
                🟢
                <span>Normal</span>
            </button>


            <button
                class="status-button unusual"
                onclick="selectStatus('Unusual', this)"
            >
                🟡
                <span>Unusual</span>
            </button>


            <button
                class="status-button concerning"
                onclick="selectStatus('Concerning', this)"
            >
                🔴
                <span>Concerning</span>
            </button>

        </div>


        <label>
            Time
        </label>

        <input
            id="bathroomTime"
            type="time"
        >


        <label>
            Notes
        </label>

        <textarea
            id="bathroomNotes"
            placeholder="Anything unusual to remember..."
        ></textarea>


        <button
            class="pink-button"
            onclick="addBathroom()"
        >
            ＋ Record Bathroom Event
        </button>

    </section>


    <!-- TODAY -->

    <section class="card">

        <div class="section-title">

            <h2>
                📋 Today's Records
            </h2>

            <span id="recordCount">
                0
            </span>

        </div>


        <div id="bathroomList"></div>

    </section>

</div>


<div id="toast"></div>


<script src="bathroom.js"></script>

</body>
</html>
