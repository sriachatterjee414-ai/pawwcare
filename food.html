<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Tracker 🐾</title>

    <link rel="stylesheet" href="food.css">
</head>

<body>

    <div class="page">

        <button class="back-button" onclick="goBack()">
            ← Back to Health
        </button>

        <header>
            <div class="icon">🍗</div>

            <div>
                <p>DAILY HEALTH</p>
                <h1>Food Tracker</h1>
                <span id="petName">🐾 My Pet</span>
            </div>
        </header>

        <section class="card">

            <h2>🍗 Add Food</h2>

            <label>Amount</label>

            <div class="amount-row">
                <input
                    id="foodAmount"
                    type="number"
                    min="0"
                    placeholder="250"
                >

                <span>grams</span>
            </div>

            <label>Food</label>

            <input
                id="foodName"
                type="text"
                placeholder="Chicken, kibble, rice..."
            >

            <label>Time</label>

            <input
                id="foodTime"
                type="time"
            >

            <button
                class="pink-button"
                onclick="addFood()"
            >
                ＋ Add Food
            </button>

        </section>


        <section class="card reminder-card">

            <h2>⏰ Food Reminder</h2>

            <p>
                Set a daily reminder for your pet's food.
            </p>

            <input
                id="foodReminder"
                type="time"
            >

            <button
                class="blue-button"
                onclick="saveFoodReminder()"
            >
                🔔 Save Reminder
            </button>

            <div id="foodReminderStatus"></div>

        </section>


        <section class="card">

            <div class="section-title">
                <h2>📋 Today's Food</h2>

                <span id="totalFood">
                    0 g
                </span>
            </div>

            <div id="foodList"></div>

        </section>

    </div>

    <div id="toast"></div>

    <script src="food.js"></script>

</body>
</html>
